<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>VoiceStock India — Inventory Manager</title>
    <meta name="description" content="Voice-first inventory management for small businesses and kirana stores in India. Supports Hindi, Telugu, Tamil, and more." />
    <meta name="author" content="VoiceStock India" />
    <meta name="theme-color" content="#10b981" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VoiceStock" />

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="VoiceStock India — Inventory Manager" />
    <meta property="og:description" content="Voice-first inventory management for small businesses and kirana stores in India." />

    <!-- Twitter/Social -->
    <meta name="twitter:card" content="summary_large_image" />

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker: only in production; unregister on localhost -->
    <script>
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let reg of registrations) {
              reg.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (let name of names) caches.delete(name);
            });
          }
        } else {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js');
          });
        }
      }
    </script>
  </body>
</html>
